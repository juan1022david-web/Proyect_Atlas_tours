<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Destinos - Atlas Tours</title>

    <!-- =====================================================
         CSS DEL CRUD
    ====================================================== -->
    <link rel="stylesheet" href="../assets/css/crud_destinos.css">

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="crud-header">

        <div class="crud-container">

            <div class="logo">

                <h1>Atlas Tours</h1>

                <span>
                    Administración de destinos
                </span>

            </div>

            <nav>

                <!-- Si empresa.html está en la carpeta principal -->
                <a href="../empresa.html">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>

                <a href="destinos.html">
                    <i class="fa-solid fa-location-dot"></i>
                    Ver destinos
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="crud-container">

        <section class="crud-panel">

            <!-- =================================================
                 TÍTULO Y BOTÓN NUEVO
            ================================================== -->

            <div class="crud-titulo">

                <div>

                    <h2>
                        Gestión de destinos
                    </h2>

                    <p>
                        Administra los destinos turísticos
                        disponibles en Atlas Tours.
                    </p>

                </div>

                <button
                    type="button"
                    class="btn-nuevo"
                    id="btnNuevoDestino">

                    <i class="fa-solid fa-plus"></i>

                    Nuevo destino

                </button>

            </div>


            <!-- =================================================
                 TABLA DE DESTINOS
            ================================================== -->

            <div class="tabla-contenedor">

                <table class="crud-tabla">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Imagen</th>

                            <th>Destino</th>

                            <th>Teléfono</th>

                            <th>Estado</th>

                            <th>Fecha creación</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaBody">

                        <!--
                            El archivo crud_destinos.js
                            cargará aquí los destinos.
                        -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =====================================================
         MODAL NUEVO / EDITAR DESTINO
    ====================================================== -->

    <div
        class="modal-overlay"
        id="modalDestino">

        <div class="modal-content">


            <!-- =================================================
                 CABECERA DEL MODAL
            ================================================== -->

            <div class="modal-header">

                <div>

                    <span class="modal-etiqueta">
                        ATLAS TOURS
                    </span>

                    <h2 id="tituloModal">
                        Nuevo destino
                    </h2>

                </div>


                <button
                    type="button"
                    class="btn-cerrar-modal"
                    id="btnCerrarModal"
                    aria-label="Cerrar">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <form id="formDestino">


                <!-- =================================================
                     ID DEL DESTINO
                ================================================== -->

                <input
                    type="hidden"
                    id="id_destino">


                <!-- =================================================
                     NOMBRE DEL DESTINO
                ================================================== -->

                <div class="campo">

                    <label for="nombre">

                        <i class="fa-solid fa-location-dot"></i>

                        Nombre del destino

                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ej: Cartagena"
                        maxlength="100"
                        required>

                </div>


                <!-- =================================================
                     DESCRIPCIÓN
                ================================================== -->

                <div class="campo">

                    <label for="descripcion">

                        <i class="fa-solid fa-align-left"></i>

                        Descripción

                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="5"
                        placeholder="Descripción del destino..."
                        required></textarea>

                </div>


                <!-- =================================================
                     IMAGEN
                ================================================== -->

                <div class="campo">

                    <label for="imagen">

                        <i class="fa-solid fa-image"></i>

                        Imagen del destino

                    </label>

                    <input
                        type="file"
                        id="imagen"
                        name="imagen"
                        accept="image/*">


                    <!--
                        Guarda la imagen actual cuando
                        estamos editando un destino.
                    -->

                    <input
                        type="hidden"
                        id="imagenActual">


                    <!-- Vista previa -->

                    <img
                        id="previewImagen"
                        src=""
                        alt="Vista previa de la imagen">

                </div>


                <!-- =================================================
                     TELÉFONO
                ================================================== -->

                <div class="campo">

                    <label for="telefono">

                        <i class="fa-solid fa-phone"></i>

                        Teléfono

                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        placeholder="322 7667943 - 322 3906478">

                </div>


                <!-- =================================================
                     ESTADO
                ================================================== -->

                <div class="campo">

                    <label for="estado">

                        <i class="fa-solid fa-circle-check"></i>

                        Estado

                    </label>

                    <select
                        id="estado"
                        name="estado"
                        required>

                        <option value="Activo">
                            Activo
                        </option>

                        <option value="Inactivo">
                            Inactivo
                        </option>

                    </select>

                </div>


                <!-- =================================================
                     BOTONES
                ================================================== -->

                <div class="modal-acciones">


                    <!-- CANCELAR -->

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btnCancelar">

                        <i class="fa-solid fa-xmark"></i>

                        Cancelar

                    </button>


                    <!-- GUARDAR -->

                    <button
                        type="submit"
                        class="btn-guardar">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Guardar destino

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         MENSAJES TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast">
    </div>


    <!-- =====================================================
         JAVASCRIPT DEL CRUD
         
         IMPORTANTE:
         destinos.html está dentro de /cruds/
         por eso usamos ../ para volver a la raíz.
    ====================================================== -->

    <script src="../assets/js/crud_destinos.js"></script>

</body>

</html>
