<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Destinos - Atlas Tours</title>

    <!-- CSS DEL CRUD -->
    <link rel="stylesheet" href="../assets/css/crud_destinos.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="crud-header">

        <div class="crud-container">

            <div class="logo">

                <h1>
                    Atlas Tours
                </h1>

                <span>
                    Administración de destinos
                </span>

            </div>


            <nav>

                <a href="../empresa.html">

                    <i class="fa-solid fa-house"></i>

                    Inicio

                </a>


                <a href="destinos.html">

                    <i class="fa-solid fa-location-dot"></i>

                    Ver destinos

                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <main class="crud-container">

        <section class="crud-panel">


            <!-- TÍTULO -->

            <div class="crud-titulo">

                <div>

                    <h2>
                        Gestión de destinos
                    </h2>

                    <p>
                        Administra los destinos turísticos
                        disponibles en Atlas Tours.
                    </p>

                </div>


                <button
                    type="button"
                    class="btn-nuevo"
                    id="btnNuevoDestino">

                    <i class="fa-solid fa-plus"></i>

                    Nuevo destino

                </button>

            </div>



            <!-- =================================================
                 TABLA
            ================================================== -->

            <div class="tabla-contenedor">

                <table class="crud-tabla">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Imagen</th>

                            <th>Destino</th>

                            <th>Teléfono</th>

                            <th>Estado</th>

                            <th>Fecha creación</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>


                    <tbody id="tablaBody">

                        <!--
                            Aquí JavaScript
                            cargará los destinos
                        -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <!-- =====================================================
         MODAL NUEVO / EDITAR DESTINO
    ====================================================== -->

    <div
        class="modal-overlay"
        id="modalDestino">


        <div class="modal-content">


            <h2 id="tituloModal">

                Nuevo destino

            </h2>



            <form id="formDestino">


                <!-- ID -->

                <input
                    type="hidden"
                    id="id_destino">



                <!-- NOMBRE -->

                <label for="nombre">

                    Nombre del destino

                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Cartagena"
                    maxlength="100"
                    required>



                <!-- DESCRIPCIÓN -->

                <label for="descripcion">

                    Descripción

                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="5"
                    placeholder="Descripción del destino..."
                    required></textarea>



                <!-- IMAGEN -->

                <label for="imagen">

                    Imagen

                </label>

                <input
                    type="file"
                    id="imagen"
                    name="imagen"
                    accept="image/*">

                <!-- ID oculto: guarda la imagen actual en base64
                     (necesario al editar sin volver a seleccionar archivo) -->
                <input
                    type="hidden"
                    id="imagenActual">

                <img
                    id="previewImagen"
                    alt="Vista previa"
                    style="
                        display: none;
                        margin-top: 10px;
                        width: 140px;
                        height: 100px;
                        object-fit: cover;
                        border-radius: 8px;
                        border: 1px solid #d1d5db;">



                <!-- TELÉFONO -->

                <label for="telefono">

                    Teléfono

                </label>

                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    placeholder="322 7667943 - 322 3906478">



                <!-- ESTADO -->

                <label for="estado">

                    Estado

                </label>

                <select
                    id="estado"
                    name="estado"
                    required>

                    <option value="Activo">
                        Activo
                    </option>

                    <option value="Inactivo">
                        Inactivo
                    </option>

                </select>



                <!-- BOTONES -->

                <div class="modal-acciones">


                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btnCancelar">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn-guardar">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Guardar

                    </button>


                </div>


            </form>

        </div>

    </div>



    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast">

    </div>



    <!-- JAVASCRIPT -->

    <script src="../assets/js/crud_destinos.js"></script>


</body>

</html>
