<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atlas Tours - Cotizaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
  <style>
    .crud-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .crud-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .crud-tabla { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .crud-tabla th, .crud-tabla td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    .crud-tabla th { background: #1a1a1a; color: #fff; }
    .crud-tabla tr:hover { background: #f7f7f7; }
    .btn-crear { background: #1a1a1a; color: #fff; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; }
    .btn-icon { border: none; background: none; cursor: pointer; font-size: 16px; margin-right: 6px; }
    .btn-icon.editar { color: #2563eb; }
    .btn-icon.eliminar { color: #dc2626; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.abierto { display: flex; }
    .modal-content { background: #fff; border-radius: 16px; width: 90%; max-width: 500px; padding: 28px; max-height: 85vh; overflow-y: auto; }
    .modal-content h2 { margin-top: 0; }
    .modal-content label { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }
    .modal-acciones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .modal-acciones button { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; }
    .btn-guardar { background: #1a1a1a; color: #fff; }
    .btn-cancelar { background: #eee; }

    .toast { display:none; position: fixed; bottom: 20px; right: 20px; padding: 14px 20px; border-radius: 8px; color: #fff; z-index: 200; }
    .toast.exito { background: #16a34a; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body>

  <div class="crud-container">
    <div class="crud-header">
      <h1>Cotizaciones</h1>
      <button class="btn-crear" id="btnNueva"><i class="fa-solid fa-plus"></i> Nueva cotización</button>
    </div>

    <table class="crud-tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Servicio</th>
          <th>Fecha</th>
          <th>Origen</th>
          <th>Destino</th>
          <th>Personas</th>
          <th>Detalles</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaBody">
        <!-- filas generadas por JS -->
      </tbody>
    </table>
  </div>

  <!-- Modal crear/editar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h2 id="modalTitulo">Nueva cotización</h2>
      <form id="formCotizacion">
        <input type="hidden" id="id_cotizacion">

        <label for="id_usuario">ID Usuario (opcional)</label>
        <input type="number" id="id_usuario" placeholder="Vacío si es invitado">

        <label for="id_tipo_servicio">ID Tipo de servicio</label>
        <input type="number" id="id_tipo_servicio" required>

        <label for="fecha_hora">Fecha y hora</label>
        <input type="datetime-local" id="fecha_hora" required>

        <label for="origen">Origen</label>
        <input type="text" id="origen" required>

        <label for="destino">Destino</label>
        <input type="text" id="destino" required>

        <label for="n_personas">Número de personas</label>
        <input type="number" id="n_personas" min="1" required>

        <label for="detalles_opcionales">Detalles opcionales</label>
        <textarea id="detalles_opcionales" rows="3"></textarea>

        <div class="modal-acciones">
          <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
          <button type="submit" class="btn-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API = '../crud_cotizaciones.php'; // ajusta la ruta según dónde quede el PHP

    const tablaBody     = document.getElementById('tablaBody');
    const modalOverlay  = document.getElementById('modalOverlay');
    const modalTitulo   = document.getElementById('modalTitulo');
    const form          = document.getElementById('formCotizacion');

    function mostrarToast(msg, tipo) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + tipo;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function abrirModal(editar = false) {
      modalTitulo.textContent = editar ? 'Editar cotización' : 'Nueva cotización';
      modalOverlay.classList.add('abierto');
    }
    function cerrarModal() {
      modalOverlay.classList.remove('abierto');
      form.reset();
      document.getElementById('id_cotizacion').value = '';
    }

    document.getElementById('btnNueva').addEventListener('click', () => abrirModal(false));
    document.getElementById('btnCancelar').addEventListener('click', cerrarModal);

    // --- LEER: cargar tabla ---
    async function cargarCotizaciones() {
      const res = await fetch(API);
      const datos = await res.json();
      tablaBody.innerHTML = '';

      datos.forEach(c => {
        const nombreUsuario = c.nombres ? `${c.nombres} ${c.apellidos}` : 'Invitado';
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${c.id_cotizacion}</td>
          <td>${nombreUsuario}</td>
          <td>${c.nombre_servicio ?? '—'}</td>
          <td>${new Date(c.fecha_hora).toLocaleString('es-CO')}</td>
          <td>${c.origen}</td>
          <td>${c.destino}</td>
          <td>${c.n_personas}</td>
          <td>${c.detalles_opcionales ?? '—'}</td>
          <td>
            <button class="btn-icon editar" onclick="editarCotizacion(${c.id_cotizacion})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-icon eliminar" onclick="eliminarCotizacion(${c.id_cotizacion})"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tablaBody.appendChild(fila);
      });
    }

    // --- EDITAR: precargar formulario ---
    async function editarCotizacion(id) {
      const res = await fetch(`${API}?id=${id}`);
      const c = await res.json();

      document.getElementById('id_cotizacion').value      = c.id_cotizacion;
      document.getElementById('id_usuario').value         = c.id_usuario ?? '';
      document.getElementById('id_tipo_servicio').value   = c.id_tipo_servicio;
      document.getElementById('fecha_hora').value         = c.fecha_hora.replace(' ', 'T').slice(0,16);
      document.getElementById('origen').value              = c.origen;
      document.getElementById('destino').value             = c.destino;
      document.getElementById('n_personas').value          = c.n_personas;
      document.getElementById('detalles_opcionales').value = c.detalles_opcionales ?? '';

      abrirModal(true);
    }

    // --- ELIMINAR ---
    async function eliminarCotizacion(id) {
      if (!confirm('¿Seguro que quieres eliminar esta cotización?')) return;

      const res = await fetch(`${API}?id=${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (data.exito) {
        mostrarToast(data.mensaje, 'exito');
        cargarCotizaciones();
      } else {
        mostrarToast(data.mensaje, 'error');
      }
    }

    // --- CREAR / ACTUALIZAR ---
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const id = document.getElementById('id_cotizacion').value;
      const payload = {
        id_usuario:           document.getElementById('id_usuario').value || null,
        id_tipo_servicio:     document.getElementById('id_tipo_servicio').value,
        fecha_hora:           document.getElementById('fecha_hora').value,
        origen:                document.getElementById('origen').value,
        destino:               document.getElementById('destino').value,
        n_personas:            document.getElementById('n_personas').value,
        detalles_opcionales:   document.getElementById('detalles_opcionales').value
      };

      let res;
      if (id) {
        payload.id_cotizacion = id;
        res = await fetch(API, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
      }

      const data = await res.json();
      if (data.exito) {
        mostrarToast(data.mensaje, 'exito');
        cerrarModal();
        cargarCotizaciones();
      } else {
        mostrarToast(data.mensaje, 'error');
      }
    });

    cargarCotizaciones();
  </script>
</body>
</html>
