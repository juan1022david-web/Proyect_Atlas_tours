<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atlas Tours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="assets/img/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
 
</head>
<body>
  <main>
    <section class="seccion-login">
      <div class="container">
        <div class="login-bienvenida">
          <h1 class="titulo-animado">Atlas Tours VIP</h1>
          <p class="texto-bienvenida">
            Bienvenido a la experiencia más exclusiva en transporte y turismo.
            Viaja con clase, confort y distinción.
            Atlas Tours VIP: donde el lujo y la aventura se encuentran.
          </p>
          <a href="index.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>
 
        <div class="login-formulario">
          <h2 class="titulo-form">Iniciar Sesión</h2>
 
          <form id="formLogin" class="form-login">
            <input type="hidden" name="formulario" value="login">
 
            <label for="correo" class="etiqueta">Correo electrónico</label>
            <input type="email" id="correo" name="correo" class="campo" placeholder="Ingrese su correo" required>
 
            <label for="password" class="etiqueta">Contraseña</label>
            <input type="password" id="password" name="password" class="campo" placeholder="Ingrese su contraseña" required>
 
            <button type="submit" class="boton" id="btnLogin">Ingresar</button>
          </form>
 
          <p class="texto-registro">
            ¿No tienes cuenta?
            <a href="registro.html" class="enlace-registro">Regístrate aquí</a>
          </p>
        </div>
      </div>
    </section>
  </main>
 
  <!-- Toast de notificación -->
  <div id="toast" class="toast"></div>
 
  <script>
    function mostrarToast(html, tipo) {
      const toast = document.getElementById('toast');
      toast.innerHTML = html;
      toast.className = 'toast ' + tipo;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }
 
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
 
      fetch('php/Base_De_Datos.php', { method: 'POST', body: new FormData(this) })
        .then(res => res.json())
        .then(data => {
          if (data.exito) {
            mostrarToast('✅ ' + data.mensaje + ' Redirigiendo...', 'exito');
            setTimeout(() => {
              window.location.href = data.redirect;
            }, 1200);
          } else {
            mostrarToast('❌ ' + data.mensaje, 'error');
            btn.disabled = false;
            btn.textContent = 'Ingresar';
          }
        })
        .catch(() => {
          mostrarToast('❌ Error de conexión. Intenta de nuevo.', 'error');
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        });
    });
  </script>
</body>
</html>
